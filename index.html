<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>귓것 — 탑의 기억</title>
<style>
  :root {
    --bg: #0a0706;
    --bg-soft: #120e0c;
    --ink: #e8d8b8;
    --ink-dim: #8a7960;
    --blood: #7a1e1a;
    --gold: #a88853;
    --accent: #c9a76a;
    --border: #3a2e22;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Serif KR", "Nanum Myeongjo", "Batang", serif;
    overflow: hidden;
  }

  body {
    background:
      radial-gradient(ellipse at 50% 20%, rgba(90,40,20,0.25), transparent 60%),
      radial-gradient(ellipse at 50% 100%, rgba(0,0,0,0.8), transparent 60%),
      var(--bg);
    position: relative;
  }

  /* 배경 노이즈 (먹 번짐 느낌) */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(0,0,0,0.04) 0 1px, transparent 1px 4px);
    pointer-events: none;
    z-index: 1;
  }

  #app {
    position: relative;
    z-index: 2;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  /* ===== 타이틀 화면 ===== */
  .title-screen {
    text-align: center;
    max-width: 760px;
    animation: fadeIn 1.8s ease-out;
  }

  .title-main {
    font-size: clamp(4rem, 12vw, 8rem);
    font-weight: 900;
    letter-spacing: 0.3em;
    color: var(--ink);
    text-shadow:
      0 0 20px rgba(170, 40, 20, 0.4),
      0 0 60px rgba(170, 40, 20, 0.15);
    margin-bottom: 0.5rem;
    position: relative;
  }

  .title-main::after {
    content: "";
    display: block;
    width: 40%;
    height: 1px;
    margin: 1.2rem auto 0.8rem;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .title-sub {
    font-size: clamp(1rem, 2vw, 1.3rem);
    color: var(--ink-dim);
    letter-spacing: 0.4em;
    margin-bottom: 3rem;
  }

  .title-epigraph {
    font-size: 0.95rem;
    color: var(--ink-dim);
    line-height: 2;
    max-width: 520px;
    margin: 0 auto 3.5rem;
    font-style: italic;
    opacity: 0.85;
    text-align: center;
  }

  .title-epigraph cite {
    display: block;
    margin-top: 1rem;
    font-size: 0.8rem;
    color: var(--gold);
    font-style: normal;
    letter-spacing: 0.2em;
  }

  .title-buttons {
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
    align-items: center;
  }

  .btn {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--border);
    padding: 0.9rem 3rem;
    font-size: 1rem;
    font-family: inherit;
    letter-spacing: 0.3em;
    cursor: pointer;
    transition: all 0.3s ease;
    min-width: 260px;
    position: relative;
  }

  .btn:hover {
    background: rgba(201, 167, 106, 0.08);
    border-color: var(--accent);
    color: var(--accent);
    letter-spacing: 0.4em;
  }

  .btn:disabled {
    color: var(--ink-dim);
    border-color: #2a2018;
    cursor: not-allowed;
  }

  .btn-primary {
    border-color: var(--accent);
    color: var(--accent);
  }

  .btn-primary:hover {
    background: rgba(201, 167, 106, 0.15);
    box-shadow: 0 0 20px rgba(201, 167, 106, 0.2);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeInSlow {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* ===== 공통 화면 컨테이너 ===== */
  .screen {
    width: 100%;
    max-width: 900px;
    animation: fadeIn 0.8s ease-out;
  }

  .screen-hidden { display: none; }

  /* ===== 캐릭터 선택 ===== */
  .select-header {
    text-align: center;
    margin-bottom: 2.5rem;
  }

  .select-header h2 {
    font-size: 2rem;
    letter-spacing: 0.3em;
    color: var(--accent);
    margin-bottom: 0.6rem;
    font-weight: 500;
  }

  .select-header p {
    color: var(--ink-dim);
    font-size: 0.95rem;
    letter-spacing: 0.1em;
  }

  .char-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1.2rem;
    margin-bottom: 2rem;
  }

  .char-card {
    background: linear-gradient(180deg, rgba(30,22,18,0.6), rgba(15,10,8,0.8));
    border: 1px solid var(--border);
    padding: 1.5rem 1.2rem;
    cursor: pointer;
    transition: all 0.3s ease;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .char-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0.3;
  }

  .char-card:hover {
    border-color: var(--accent);
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.6), 0 0 20px rgba(201,167,106,0.1);
  }

  .char-card .glyph {
    font-size: 3rem;
    color: var(--accent);
    margin-bottom: 0.8rem;
    font-weight: 900;
    letter-spacing: -0.1em;
    opacity: 0.85;
  }

  .char-card h3 {
    font-size: 1.3rem;
    color: var(--ink);
    margin-bottom: 0.4rem;
    letter-spacing: 0.15em;
  }

  .char-card .role {
    font-size: 0.8rem;
    color: var(--gold);
    letter-spacing: 0.2em;
    margin-bottom: 0.8rem;
  }

  .char-card .desc {
    font-size: 0.85rem;
    color: var(--ink-dim);
    line-height: 1.7;
  }

  .char-card.completed {
    border-color: var(--blood);
  }

  .char-card.completed::after {
    content: "흉접";
    position: absolute;
    top: 8px; right: 8px;
    font-size: 0.7rem;
    color: var(--blood);
    letter-spacing: 0.2em;
    border: 1px solid var(--blood);
    padding: 2px 6px;
  }

  .nav-bar {
    display: flex;
    justify-content: space-between;
    margin-top: 1.5rem;
  }

  .btn-ghost {
    background: transparent;
    border: none;
    color: var(--ink-dim);
    font-family: inherit;
    font-size: 0.9rem;
    letter-spacing: 0.2em;
    cursor: pointer;
    padding: 0.5rem 1rem;
    transition: color 0.3s;
  }

  .btn-ghost:hover { color: var(--accent); }

  /* ===== 씬 화면 ===== */
  .scene-wrap {
    display: flex;
    flex-direction: column;
    height: calc(100vh - 4rem);
    max-height: 800px;
  }

  .scene-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 2rem;
  }

  .scene-location {
    color: var(--gold);
    font-size: 0.9rem;
    letter-spacing: 0.3em;
  }

  .scene-character {
    color: var(--ink-dim);
    font-size: 0.85rem;
    letter-spacing: 0.2em;
  }

  .scene-body {
    flex: 1;
    overflow-y: auto;
    padding: 1rem 0.5rem 2rem 0.5rem;
    line-height: 2.1;
    font-size: 1.05rem;
    color: var(--ink);
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .scene-body::-webkit-scrollbar { width: 6px; }
  .scene-body::-webkit-scrollbar-thumb { background: var(--border); }

  .scene-body p {
    margin-bottom: 1.2rem;
    animation: fadeInSlow 0.8s ease-out;
  }

  .scene-body .dialogue {
    color: var(--accent);
    padding-left: 1.2rem;
    border-left: 2px solid var(--border);
    font-style: italic;
  }

  .scene-body .whisper {
    color: var(--ink-dim);
    font-size: 0.95rem;
    text-align: center;
    letter-spacing: 0.15em;
  }

  .scene-body .omen {
    color: var(--blood);
    text-align: center;
    font-size: 1.1rem;
    letter-spacing: 0.3em;
    margin: 2rem 0;
    text-shadow: 0 0 12px rgba(122, 30, 26, 0.6);
  }

  .cursor-blink::after {
    content: "▍";
    color: var(--accent);
    animation: blink 0.8s step-end infinite;
    margin-left: 2px;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  .scene-footer {
    border-top: 1px solid var(--border);
    padding-top: 1.2rem;
    margin-top: 1rem;
  }

  .choices {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    animation: fadeIn 0.6s ease-out;
  }

  .choice {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--ink);
    font-family: inherit;
    padding: 0.9rem 1.4rem;
    text-align: left;
    cursor: pointer;
    font-size: 0.98rem;
    transition: all 0.25s;
    line-height: 1.6;
  }

  .choice:hover {
    border-color: var(--accent);
    background: rgba(201,167,106,0.06);
    color: var(--accent);
    transform: translateX(4px);
  }

  .choice .idx {
    color: var(--gold);
    margin-right: 0.8rem;
    font-weight: 700;
  }

  .continue-btn {
    display: block;
    margin: 0 auto;
    padding: 0.6rem 2rem;
    font-size: 0.9rem;
    letter-spacing: 0.4em;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--gold);
    font-family: inherit;
    cursor: pointer;
    transition: all 0.3s;
  }

  .continue-btn:hover {
    border-color: var(--accent);
    background: rgba(201,167,106,0.08);
  }

  /* ===== 결말 화면 ===== */
  .ending-screen {
    text-align: center;
    max-width: 700px;
    padding: 3rem 2rem;
  }

  .ending-title {
    font-size: 2.5rem;
    letter-spacing: 0.3em;
    color: var(--blood);
    margin-bottom: 1rem;
    text-shadow: 0 0 20px rgba(122, 30, 26, 0.5);
  }

  .ending-title.safe { color: var(--gold); text-shadow: 0 0 20px rgba(201,167,106,0.3); }
  .ending-title.cursed { color: var(--blood); }

  .ending-label {
    font-size: 0.85rem;
    color: var(--ink-dim);
    letter-spacing: 0.4em;
    margin-bottom: 2rem;
  }

  .ending-body {
    color: var(--ink);
    line-height: 2;
    font-size: 1rem;
    margin-bottom: 2.5rem;
    text-align: left;
  }

  .ending-body p {
    margin-bottom: 1rem;
    animation: fadeInSlow 1s ease-out;
  }

  .ending-divider {
    width: 50%;
    height: 1px;
    margin: 2rem auto;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0.4;
  }
</style>
</head>
<body>
<div id="app">

  <!-- 캐릭터 선택 -->
  <div id="screen-select" class="screen screen-hidden">
    <div class="select-header">
      <h2>시 점 을   고 르 다</h2>
      <p>네 사람이 같은 바람을 맞으나, 각자 다른 흉신을 마주한다</p>
    </div>
    <div class="char-grid" id="char-grid"></div>
    <div class="nav-bar">
      <button class="btn-ghost" id="btn-back-title">← 처음으로</button>
      <span></span>
    </div>
  </div>

  <!-- 씬 재생 -->
  <div id="screen-scene" class="screen screen-hidden">
    <div class="scene-wrap">
      <div class="scene-header">
        <span class="scene-location" id="scene-location"></span>
        <span class="scene-character" id="scene-character"></span>
      </div>
      <div class="scene-body" id="scene-body"></div>
      <div class="scene-footer" id="scene-footer"></div>
    </div>
  </div>

  <!-- 엔딩 -->
  <div id="screen-ending" class="screen screen-hidden">
    <div class="ending-screen">
      <p class="ending-label" id="ending-label">결 말</p>
      <h2 class="ending-title" id="ending-title"></h2>
      <div class="ending-divider"></div>
      <div class="ending-body" id="ending-body"></div>
      <button class="btn btn-primary" id="btn-ending-back">시 점 선 택 으 로</button>
    </div>
  </div>

  <!-- 타이틀 화면 -->
  <div id="screen-title" class="title-screen">
    <h1 class="title-main">귓것</h1>
    <p class="title-sub">탑 의 기 억</p>
    <p class="title-epigraph">
      귀한 것은 하늘에 매여있고, 흉한 것은 땅에 매여있다.<br>
      사람은 하늘이 귀할지라도 그 귀함을 모르며,<br>
      땅이 흉할지라도 그 흉함을 모른다.
      <cite>— 발라하리 전설</cite>
    </p>
    <div class="title-buttons">
      <button class="btn btn-primary" id="btn-start">이 야 기 를   시 작 하 다</button>
      <button class="btn" id="btn-continue" disabled>이 어 서   하 기</button>
      <button class="btn" id="btn-bestiary" disabled>귓 것   도 감</button>
    </div>
  </div>

</div>

<script>
  // ===== 캐릭터 정보 =====
  const CHARACTERS = {
    diraq: {
      id: 'diraq',
      name: '디라크',
      role: '퇴역 군인 / 탐사대장',
      glyph: '劍',
      desc: '제국 중앙군 출신의 노병. 익히 모르는 대륙에서 잿빛 탑의 문을 연다.',
      location: '아말 대륙 · 이름 없는 탑',
      ghost: 'docheol',
    },
    ahbiya: {
      id: 'ahbiya',
      name: '아비야',
      role: '학술원 원생',
      glyph: '字',
      desc: '다하모 학술원에서 문학을 공부하는 청년. 할머니의 귀접을 따라 소도에 들다.',
      location: '미오 연합 · 미트리아 성소',
      ghost: 'hondon',
    },
    gerun: {
      id: 'gerun',
      name: '게룬',
      role: '북방의 망나니',
      glyph: '弓',
      desc: '바랏사의 사고뭉치 청년. 다리를 다친 채 설산 수렵행에 기어이 오르다.',
      location: '예히 공국 · 바랏사 설산',
      ghost: 'gungi',
    },
    hiyar: {
      id: 'hiyar',
      name: '히야르',
      role: '루한 소대장',
      glyph: '雪',
      desc: '유력 세도가의 조카. 함다 산 수색대를 이끌고 적진 깊숙이 들어가다.',
      location: '루한 공국 · 함다 산',
      ghost: 'doul',
    },
  };

  const GHOSTS = {
    docheol: { name: '도철', subtitle: '饕餮' },
    gungi:   { name: '궁기', subtitle: '窮奇' },
    doul:    { name: '도올', subtitle: '檮杌' },
    hondon:  { name: '혼돈', subtitle: '渾沌' },
  };

  // ===== 씬 저장소 (각 루트에서 채움) =====
  const SCENES = {};

  // ===== 디라크 루트 : 탑 프롤로그 =====
  SCENES.diraq = {
    start: {
      lines: [
        { text: '탑은 죽어있었다. 짙은 녹음 아래에 묻힌 잿빛 쇳덩어리는 홀로 신음할 뿐이다.' },
        { text: '다섯 명의 조사단은 담쟁이덩굴을 부수고 입구를 넘어섰다. 덩치 큰 디라크는 등에 걸머진 다섯 자 날붙이의 무게를 다시 가늠해 보았다.' },
        { type: 'dialogue', text: '귀신 나올 만한 곳이라더니……. 제사장들 말이 정확했네. 이번에는 제대로 찾은 거겠지?' },
        { text: '네하는 여전히 능글거렸고, 해수는 도둑놈을 잡죄었다. 구에몬은 전국 시대의 문양을 읽었고, 세녹은 조용히 주변을 살폈다.' },
        { text: '쓰러진 조각상들이 안쓰럽게 흩어져 있었으나, 2층으로 오르는 나선계단은 위압적이었다. 저 멀리 지하로 내려가는 통로가 보였다.' },
        { type: 'whisper', text: '「일단 지하부터 훑어볼까.」' },
      ],
      next: 'descend',
    },

    descend: {
      lines: [
        { text: '지하 통로는 횃불이 없이는 한 걸음도 옮기기 힘들었다. 양쪽 벽의 부조는 깊이 들어갈수록 짙어졌고, 음각의 짐승들은 어느새 양각의 인간으로 바뀌었다.' },
        { text: '벌거벗은 남녀의 교합. 인간을 집어삼키는 비대한 사람. 짐승과 뒤엉킨 군상. 머리 셋 달린 뱀이 상반신을 물어뜯고, 두 동강 난 다리는 벽면 바깥으로 돌출되어 있었다.' },
        { type: 'dialogue', text: '이봐요 교수님, 어째 탑 전체가 이단과 음란의 소굴인 것 같은데. 우리 극락 가기는 글렀네.' },
        { text: '구에몬은 기술적 성취를 들먹였다. 세녹은 긴 머리를 헝클어뜨리며 부르소 부족도 이 정도는 아니라 했다. 네하는 빙글거렸고, 디라크는 그저 속이 불편할 뿐이었다.' },
        { text: '복도의 끝, 별무리가 장엄하게 휘감긴 매끈한 문이 나타났다. 장식도 새김도 없이, 지나치게 깨끗했다.' },
      ],
      choices: [
        { text: '「내가 먼저 들어가 보겠네. 신호를 주기 전까진 따라오지 마라.」', next: 'room_alone' },
        { text: '「다 함께 들어가세. 무슨 일이 나면 같이 봐야 할 것 아닌가.」', next: 'room_together' },
      ],
    },

    room_alone: {
      lines: [
        { text: '디라크는 힘있게 문고리를 돌렸다. 뜻밖에도 문은 가볍게 열렸다.' },
        { text: '횃불을 들이밀었지만 방의 폭조차 가늠할 수 없었다. 벽에 붙어 조심스레 발을 옮겨 횃불을 걸어놓고, 허리춤에 손을 올렸다.' },
        { type: 'dialogue', text: '영감님, 어때요? 우리 들어가도 됩니까?' },
        { text: '네하의 목소리가 문 밖에서 들려오는 순간, 디라크는 위화감에 사로잡혔다. 꼬마 도둑의 목소리는 마치 물속에서 듣는 것 같이 먹먹하고 둔탁했다.' },
        { type: 'whisper', text: '어째 이리 더운 거지……?' },
        { text: '땀 한 방울이 길게 흘렀다. 시야는 아직도 어두웠고, 어느새 방 중앙 부근에 도달해 있었다. 모서리에는 — 복도의 부조가 아닌, 진짜 조각상이 완연한 고체의 질감으로 서 있었다.' },
      ],
      next: 'combat_intro',
    },

    room_together: {

        { type: 'dialogue', text: '「……자식, 눈치는 빨라가지고. 보다시피 이건 정보과의 공식 문서가 아닐세. 중요한 것은, 우리가 이 문서를 받았다는 사실이 대장군과 도원수까지 모두 알게 될 것이라는 거지. 기똥차게 뜨거운 이야기를 하나만 만들어주면 지원 병력이 더 늘어나지 않겠는가?」' },
        { type: 'whisper', text: '연출자는 따로 있군…….' },
        { text: '궁내부. 토가르 후작. 자신의 백부. 히야르는 모래를 씹는 기분이 되어 발끝을 모았다. 이 어이없는 작전에 자기 이름이 왜 필요한지, 이제는 너무 잘 알겠다.' },
      ],
      next: 'meet_haru',
    },

    brief_obey: {
      lines: [
        { text: '히야르는 크게 숨을 들이마셨다. 훈련감은 분명히 「지휘관이 상급부대의 미친 소리를 그대로 수용하여 작전을 지시하는 상황」에 대처하는 법을 가르쳐주지 않았다.' },
        { type: 'dialogue', text: '「예, 알겠습니다!」' },
        { text: '대대장의 입꼬리가 살짝 올라갔다. 능구렁이 같은 영감이었다. 궁내부가 원하든, 백부가 원하든, 결국에는 현장에서 죽어 나가는 것은 아랫것들이었다.' },
        { text: '히야르는 자신이 진급 욕심 내는 중대장들처럼 명령을 받들기로 한 것이 씁쓸했다. 그나마 훈련감을 졸업한 젊은 귀족의 자존심을 한 꺼풀 벗어던진 것으로 위안을 삼았다.' },
      ],
      next: 'meet_haru',
    },

    meet_haru: {
      lines: [
        { text: '구석에 있던 하사관 두 명이 일어섰다. 체격 조건으로는 훈련감에서도 평균 이상이었던 히야르가, 앞에 다가온 하사관들 앞에서는 어깨를 펴기가 힘들었다.' },
        { type: 'dialogue', text: '「단결. 처음 뵙겠습니다. 배속대장이 젊은 분이라 다행입니다. 앞으로 고된 산행이 이어질 예정이니 잘 부탁드립니다.」' },
        { text: '불빛 아래에서야 히야르는 상급자로 보이는 부교가 머리가 짧은 여성임을 알았다. 람카 참교는 키가 작되 몸이 탄탄했고, 하도르 외솔 부교는 매끄러운 팔다리에 키가 훤칠했다. 소속은 기밀이라 했다.' },
        { text: '특작 부대. 정보과가 보낸 사람들. 이들의 목표는 「제대로 된 도올」이 찍힌 보고서일 것이다. 히야르는 드디어 전쟁이 아니라, 다른 무엇을 시작해야 한다는 것을 알았다.' },
      ],
      next: 'crossing',
    },

    crossing: {
      lines: [
        { text: '중앙 능선을 타고 사냥개마루까지 올라오는 동안, 짐승들은 하나같이 꼬리를 말고 도망갔다. 불곰조차 예외가 아니었다.' },
        { type: 'dialogue', text: '「함다 산 불곰이 사람 무서워하는 것 들어보셨습니까? 온몸에 화살 꽂고도 이십 리를 멀쩡하게 기어가는 놈입니다.」' },
        { text: '히야르는 분대장의 말을 애써 무시했다. 드디어 예히의 동맹군이 보였다. 키가 작고 덥수룩한 수염의 하쿤 사내, 후카 보라나 정위가 군례를 건넸다.' },
        { type: 'dialogue', text: '「중부 침투로를 빗겨 타고 올라가면 오모가리 고개까지 이틀 내로 갈 수 있겠구려. 조심하시오. 제국군보다 더 위험한 것이 존재할 수도 있소.」' },
        { text: '남쪽 장애물이 깨끗하게 치워져 있었다. 동맹군도 알고 있었다. 그들도 미끼를 던지고 있는 것이었다.' },
      ],
      next: 'skirmish',
    },

    skirmish: {
      lines: [
        { text: '기도비닉 3단계로 올라간 수색대는 기습 화살을 맞았다. 하도르가 히야르를 넘어뜨려 화살비를 피하게 했다.' },
        { type: 'dialogue', text: '「응사하라! 1분대 좌익 약진, 2분대 궁병 엄호, 참교 우회기동!」' },
        { text: '히야르는 정면으로 달려들었다. 제국군 지휘관은 골격이 제법 큰 사내였고, 대검을 들고 그를 막아섰다. 체격에서 밀렸지만, 훈련감에서 갈고 닦은 쾌검이 있었다.' },
        { text: '하도르의 단검이 제국군 궁수의 관자놀이를 뚫었다. 람카가 높은 곳으로 올라 목을 치는 동안, 히야르는 정면의 지휘관과 검을 맞대었다.' },
        { type: 'whisper', text: '제국의 검법은 무겁고 정직하다. 무게를 겨루지 말고 흘려라.' },
        { text: '지휘관은 끝내 부하들을 이끌고 남쪽 기슭으로 퇴각했다. 히야르는 주저앉아 숨을 골랐다. 추격할지, 여기서 멈출지 결정해야 했다.' },
      ],
      choices: [
        { text: '기슭으로 추격한다 — 제국군의 숙영지를 뒤진다', next: 'corpses' },
        { text: '오모가리 고개 진로를 유지한다 — 시간을 아낀다', next: 'advance' },
      ],
    },

    advance: {
      lines: [
        { text: '히야르는 추격을 포기했다. 오모가리 고개는 서류상의 목표였지만, 그래도 지휘관으로서 임무는 완수해야 했다.' },
        { text: '그러나 북진하는 동안, 짐승들의 양태가 이상했다. 잠에서 덜 깬 불곰조차 수색대를 보고 꼬리를 말았다. 밤이 되자 뒤에서 누군가 나무를 꺾고 수풀을 파헤치며 따라오는 소리가 들렸다.' },
        { type: 'whisper', text: '「꼬리에 불이 붙었습니다.」' },
        { text: '사하빈 분대장이 힐록 노병과 함께 마비산을 뿌렸다. 하지만 한 시진 째, 추격의 간격은 소름 끼칠 정도로 정밀하게 유지되었다. 이는 인간의 움직임이 아니었다.' },
        { text: '제국군의 포위망일 수도 있었다. 하지만 히야르는 알았다. 포위망을 만들 만한 적군은 교류 전선에 없다는 것을. 저것은 다른 것이었다.' },
      ],
      next: 'pursuit_choice',
    },

    corpses: {
      lines: [
        { text: '남쪽 기슭의 작은 숙영지. 일회용 천막 두 동이 어지럽게 접혀있는 가운데, 일곱 구의 시체가 흩어져 있었다.' },
        { text: '사지가 절단되거나 반 토막이 난 시체들. 가벼운 갑주 차림이었던 제국군은 모두 알몸이 되어있거나 넝마가 된 속옷을 반쯤 걸치고 있었다. 그리고 방금 전까지 검을 맞대었던 지휘관의 목 없는 시신이 한가운데에 있었다.' },
        { text: '람카가 부풀어 오른 장기 하나를 들어 올려 내밀었다. 둥그렇고 말랑한 것이 손을 대자마자 가루처럼 바스라졌다.' },
        { type: 'dialogue', text: '「죽은 지 한 식경도 안된 시체가 썩은 겁니다. 수색 의무관 5년 차에 이런 것은 처음 봅니다.」' },
        { type: 'whisper', text: '범이 있었다면 우리한테도 왔겠지. 그리고 범은 무기를 먹지 않는다.' },
        { text: '히야르는 주변의 날붙이와 갑주가 모조리 사라진 것을 알았다. 범이 아니었다. 제국군도 아니었다.' },
      ],
      next: 'pursuit_choice',
    },

    pursuit_choice: {
      lines: [
        { text: '새벽이 오기 전에, 히야르는 결정을 내려야 했다. 오모가리 고개는 서류상의 목표일 뿐이었고, 보급품은 제한되어 있으며, 대원들은 지쳐 있었다.' },
        { text: '람카는 적극적인 수색을 주장했다. 하도르는 절충안을 내놓았다. 히야르는 자신이 훈련감 우등생이 아니라, 단지 스물 몇 살의 젊은이라는 것을 오랜만에 실감했다.' },
        { text: '꼬리는 여전히 뒤에 붙어 있었다.' },
      ],
      choices: [
        { text: '「임무 중단. 전원 본대로 복귀한다.」 — 살리는 것이 먼저다', next: 'return' },
        { text: '「계속 전진한다. 고지를 점령한 뒤 결정한다.」 — 임무는 임무다', next: 'push' },
      ],
    },

    return: {
      lines: [
        { text: '수색지대는 사냥개마루 방향으로 신속하게 회군했다. 길은 험했다. 람카는 보고서가 백지가 될 것이라 불평했지만, 히야르는 상관하지 않기로 했다.' },
        { text: '숙영지로 돌아왔을 때, 저 멀리 사냥개마루에 횃불이 원을 그리다가 사방으로 퍼지는 것이 보였다. 공병대가 피울 수 있는 규모가 아니었다.' },
        { text: '시루와 오트린의 부상이 심해 치료가 필요했다. 힐록 노병이 사하빈 마비산을 꺼냈다. 어떻게든 본대로 돌아가기 전에, 아이들을 살려야 했다.' },
        { text: '그때 병사 하나가 수풀 쪽으로 돌을 던지기 시작했다.' },
        { type: 'dialogue', text: '「저쪽에 분명히 누가 있었어요!」' },
      ],
      next: 'encounter',
    },

    push: {
      lines: [
        { text: '히야르는 입을 굳게 다물고 손을 내저었다. 회군은 수치였다.' },
        { text: '그러나 한 시진도 지나지 않아, 수색대는 적의 추격을 떨쳐내지 못한다는 것을 인정해야 했다. 대원들의 기도비닉은 이미 깨진 지 오래였고, 보급품은 반으로 줄어들었다.' },
        { text: '오모가리 고개 직전의 마지막 능선에서, 하도르가 조용히 말했다.' },
        { type: 'dialogue', text: '「군대는 사기를 먹고 삽니다. 소대장님. 가장 다루기 어려운 군대는……세 가지가 있지요.」' },
        { text: '히야르는 알고 있었다. 그중 하나는 퇴각하는 군대였고, 다른 하나는 길을 잃은 군대였으며, 마지막은 사기를 먹지도 뱉지도 못하는 군대였다. 그의 부대는 이미 셋 모두에 해당했다.' },
        { type: 'whisper', text: '「……사냥개마루로 돌아간다.」' },
      ],
      next: 'encounter',
    },

    encounter: {
      lines: [
        { text: '사냥개마루 앞 공터. 사람의 시체가 보이지 않았다. 흙을 판 자리도 말끔했다. 공병대의 불빛이 현란하게 이지러지며 사방으로 퍼졌다가, 어느새 수풀 앞에 나와 있었다.' },
        { text: '숲의 그림자에서 벗어난 이리의 몸은 거대했다. 적갈빛 털은 어두운 새벽에도 윤기가 흐르는 것이 훤히 보였고, 육중한 앞발과 뒷발은 범의 것을 닮아 강인했다.' },
        { text: '두건을 쓴 듯 목의 갈기로 덮인 머리에는 이리의 아가리 대신 사람의 얼굴이, 열사흘부스럼이 왔다가 겨우 살아남은 듯한 아이의 얼굴이 있었다. 심하게 얽은 자국은 이리저리 깊게 파여 얼굴 전체에 눈이 달린 듯했고, 갈라진 틈은 여전히 무겁게 타오르며 빛을 뿜었다.' },
        { type: 'omen', text: '도올.' },
        { text: '람카가 검을 꺼내들었다. 하도르가 그의 팔을 잡으려 했지만 이미 늦었다.' },
        { type: 'dialogue', text: '「저는 무슨 일이 있어도, 마긴의 더러운 짐승들과는 같은 하늘을 이고 살 수 없습니다!」' },
      ],
      choices: [
        { text: '람카와 함께 돌격한다 — 전우를 버릴 수 없다', next: 'ending_charge' },
        { text: '하도르의 품에 몸을 맡긴다 — 살아서 증언하라', next: 'ending_ditch' },
        { text: '혼자 숲으로 달아난다 — 백부의 그늘로 돌아간다', next: 'ending_flee' },
      ],
    },

    ending_charge: {
      ending: true,
      kind: 'cursed',
      label: '첫 째  결 말',
      title: '시 아 라 에 서  죽 은  자 들',
      lines: [
        { text: '히야르는 대검을 뽑았다. 람카의 등 뒤에서, 그는 일곱 살 때 포목점 주인의 망아지를 훔쳤던 그 소년으로 잠깐 돌아갔다. 백부의 말을 떠올렸다.' },
        { type: 'whisper', text: '「도올에게 물려가지 않으려면 어떻게 해야겠어?」' },
        { text: '나쁜 짓을 하지 않아야 한다고, 어린 히야르는 눈물을 훔치며 대답했다. 이불에는 누렇게 뜬 웅덩이 자국이 남았다.' },
        { text: '람카의 몸이 짐승의 입에 물려 다리가 밤하늘에 휘저어지는 것을 보았을 때, 히야르는 서슴없이 그 옆으로 뛰어들었다.' },
        { text: '훗날 시아라에서 죽은 그의 누이 해나가 오라버니 옆에서 손을 내밀었다. 기린 깃발 아래, 배신자의 이름으로 묻힌 이들이 그를 맞이했다.' },
        { text: '본대에는 하도르 홀로 돌아왔다.' },
      ],
    },

    ending_ditch: {
      ending: true,
      kind: 'safe',
      label: '둘 째  결 말',
      title: '흉 주 · 凶呪',
      lines: [
        { text: '하도르의 사정없는 발길질에, 히야르는 구덩이 속으로 굴러떨어졌다. 밧줄에 묶인 것처럼 힘을 쓸 수 없었고, 하도르가 그의 몸을 힘껏 누르며 무어라 외쳤다.' },
        { text: '머리 위로 흙더미가 쏟아졌다. 구덩이 틈으로, 구름 한 점 없는 못생긴 달이 떨어지는 피에 가려졌다. 사람이 씹히는 소리, 뼈가 부러지는 소리, 짐승이 우는 소리.' },
        { text: '정신을 차렸을 때, 사냥개마루의 앞마당에는 그 어떤 참상의 흔적도 없었다. 도올도, 대원들의 시체도 없이 깨끗했다.' },
        { text: '하도르의 왼쪽 팔에는 검은 소용돌이가 박혀 있었다. 히야르는 자신의 몸에도 어딘가에 그것이 있을 것을 알았다. 확인할 용기는 없었다.' },
        { type: 'dialogue', text: '「이 사건의 경위는 함부로 정보과에 내보낼 수가 없네. 자네, 일단은 군단 본부에 그럴듯한 보고를 올려야겠네. 그리고……내부 분석용으로 제대로 된 녀석을 하나 더 만들어 줘야겠어.」' },
        { text: '백부는 진짜 미끼가 필요했다. 히야르는 라한으로 갈 것이다. 농발거미의 서신이 기다리고 있었다.' },
      ],
    },

    ending_flee: {
      ending: true,
      kind: 'cursed',
      label: '셋 째  결 말',
      title: '백 부 의  조 카',
      lines: [
        { text: '히야르는 하도르의 손을 뿌리쳤다. 그는 뛰었다. 수풀 속으로, 남쪽으로, 사냥개마루 너머로.' },
        { text: '짐승의 울음소리가 멀어졌다. 대원들의 비명이 다시 멀어졌다. 새벽이 밝아올 때까지, 그는 달렸다.' },
        { text: '길조이의 지휘소로 돌아왔을 때, 카힌 부령은 말없이 그를 쳐다보았다. 이틀 뒤, 토가르 후작의 친서가 도착했다. 장조카의 안위를 걱정하는 따뜻한 글월이었다.' },
        { text: '히야르는 그 글월을 아주 오래 들여다보았다. 서신의 마지막 줄에 이렇게 쓰여 있었다.' },
        { type: 'whisper', text: '「사건의 경위는 내가 적당히 정리해두마. 너는 편히 쉬거라.」' },
        { text: '그는 진급했다. 정위가 되었고, 이윽고 훈련감으로 돌아갔다. 장교 양성관 교관이 되어, 후배들에게 함다 산에 대해 아주 자세히 강의했다. 도올이라는 이름만 빼고.' },
        { text: '매일 밤, 그는 누렇게 뜬 웅덩이를 만들던 일곱 살 소년의 꿈을 꾸었다.' },
      ],
    },
  };

  // ===== 게임 상태 =====
  const STORAGE_KEY = 'gitgeot_save_v1';

  const State = {
    data: {
      completed: {},      // { diraq: true, ahbiya: true, ... }
      bestiary: {},       // { docheol: true, hondon: true, ... }
      currentScene: null,
    },
    load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) this.data = Object.assign(this.data, JSON.parse(raw));
      } catch(e) {}
    },
    save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(this.data));
      } catch(e) {}
    },
    reset() {
      this.data = { completed: {}, bestiary: {}, currentScene: null };
      this.save();
    },
    hasSave() {
      return this.data.currentScene !== null;
    },
    hasBestiary() {
      return Object.keys(this.data.bestiary).length > 0;
    }
  };

  // ===== 화면 전환 =====
  function showScreen(id) {
    document.querySelectorAll('.screen, .title-screen').forEach(el => {
      el.classList.add('screen-hidden');
    });
    const target = document.getElementById(id);
    if (target) target.classList.remove('screen-hidden');
  }

  // ===== 캐릭터 선택 =====
  function renderCharSelect() {
    const grid = document.getElementById('char-grid');
    grid.innerHTML = '';
    Object.values(CHARACTERS).forEach(ch => {
      const completed = State.data.completed[ch.id];
      const card = document.createElement('div');
      card.className = 'char-card' + (completed ? ' completed' : '');
      card.innerHTML = `
        <div class="glyph">${ch.glyph}</div>
        <h3>${ch.name}</h3>
        <div class="role">${ch.role}</div>
        <div class="desc">${ch.desc}</div>
      `;
      card.addEventListener('click', () => startRoute(ch.id));
      grid.appendChild(card);
    });
    showScreen('screen-select');
  }

  // ===== 씬 재생 엔진 =====
  const Scene = {
    currentRoute: null,
    currentId: null,
    typingTimer: null,
    skip: false,

    start(route, sceneId) {
      this.currentRoute = route;
      this.currentId = sceneId;
      const ch = CHARACTERS[route];
      document.getElementById('scene-location').textContent = ch.location;
      document.getElementById('scene-character').textContent = ch.name;
      State.data.currentScene = { route, sceneId };
      State.save();
      showScreen('screen-scene');
      this.render();
    },

    render() {
      const scene = SCENES[this.currentRoute] && SCENES[this.currentRoute][this.currentId];
      if (!scene) {
        console.error('Scene not found:', this.currentRoute, this.currentId);
        return;
      }

      if (scene.ending) {
        this.showEnding(scene);
        return;
      }

      const body = document.getElementById('scene-body');
      const footer = document.getElementById('scene-footer');
      body.innerHTML = '';
      footer.innerHTML = '';
      body.scrollTop = 0;
      this.skip = false;

      this.typeLines(scene.lines || [], 0, body, () => {
        this.renderFooter(scene, footer);
      });
    },

    typeLines(lines, idx, container, done) {
      if (idx >= lines.length) { done(); return; }

      const line = lines[idx];
      const p = document.createElement('p');
      if (line.type) p.classList.add(line.type);
      p.classList.add('cursor-blink');
      container.appendChild(p);
      container.scrollTop = container.scrollHeight;

      const text = line.text || '';
      let i = 0;
      const step = () => {
        if (this.skip) {
          p.textContent = text;
          p.classList.remove('cursor-blink');
          this.typeLines(lines, idx + 1, container, done);
          return;
        }
        if (i <= text.length) {
          p.textContent = text.slice(0, i);
          i++;
          container.scrollTop = container.scrollHeight;
          this.typingTimer = setTimeout(step, line.type === 'omen' ? 70 : 22);
        } else {
          p.classList.remove('cursor-blink');
          this.typingTimer = setTimeout(() => {
            this.typeLines(lines, idx + 1, container, done);
          }, line.type === 'omen' ? 600 : 180);
        }
      };
      step();
    },

    skipTyping() {
      this.skip = true;
    },

    renderFooter(scene, footer) {
      if (scene.choices && scene.choices.length) {
        const wrap = document.createElement('div');
        wrap.className = 'choices';
        scene.choices.forEach((ch, i) => {
          const btn = document.createElement('button');
          btn.className = 'choice';
          btn.innerHTML = `<span class="idx">${['一','二','三','四'][i]||(i+1)}</span>${ch.text}`;
          btn.addEventListener('click', () => {
            Scene.start(this.currentRoute, ch.next);
          });
          wrap.appendChild(btn);
        });
        footer.appendChild(wrap);
      } else if (scene.next) {
        const btn = document.createElement('button');
        btn.className = 'continue-btn';
        btn.textContent = '다 음   →';
        btn.addEventListener('click', () => Scene.start(this.currentRoute, scene.next));
        footer.appendChild(btn);
      }
    },

    showEnding(scene) {
      const titleEl = document.getElementById('ending-title');
      const labelEl = document.getElementById('ending-label');
      const bodyEl = document.getElementById('ending-body');

      titleEl.className = 'ending-title';
      if (scene.kind) titleEl.classList.add(scene.kind);
      titleEl.textContent = scene.title || '결말';
      labelEl.textContent = scene.label || '결 말';

      bodyEl.innerHTML = '';
      (scene.lines || []).forEach(l => {
        const p = document.createElement('p');
        if (l.type) p.classList.add(l.type);
        p.textContent = l.text;
        bodyEl.appendChild(p);
      });

      // 루트 완료 기록, 도감 해금
      State.data.completed[this.currentRoute] = scene.kind || true;
      const ch = CHARACTERS[this.currentRoute];
      if (ch && ch.ghost) State.data.bestiary[ch.ghost] = true;
      State.data.currentScene = null;
      State.save();

      showScreen('screen-ending');
    },
  };

  function startRoute(charId) {
    if (!SCENES[charId]) {
      alert('이 시점의 이야기는 다음 단계에서 담깁니다.');
      return;
    }
    Scene.start(charId, 'start');
  }

  // ===== 초기화 =====
  function init() {
    State.load();

    // 버튼 활성화
    const btnContinue = document.getElementById('btn-continue');
    const btnBestiary = document.getElementById('btn-bestiary');
    if (State.hasSave()) btnContinue.disabled = false;
    if (State.hasBestiary()) btnBestiary.disabled = false;

    document.getElementById('btn-start').addEventListener('click', renderCharSelect);

    document.getElementById('btn-continue').addEventListener('click', () => {
      if (State.data.currentScene) {
        Scene.start(State.data.currentScene.route, State.data.currentScene.sceneId);
      }
    });

    document.getElementById('btn-bestiary').addEventListener('click', () => {
      alert('도감은 다음 단계에서 구현됩니다.');
    });

    document.getElementById('btn-back-title').addEventListener('click', () => {
      showScreen('screen-title');
      refreshTitleButtons();
    });

    document.getElementById('btn-ending-back').addEventListener('click', () => {
      renderCharSelect();
    });

    // 씬 화면에서 클릭 시 타이핑 스킵
    document.getElementById('screen-scene').addEventListener('click', (e) => {
      if (e.target.tagName === 'BUTTON') return;
      Scene.skipTyping();
    });
  }

  function refreshTitleButtons() {
    document.getElementById('btn-continue').disabled = !State.hasSave();
    document.getElementById('btn-bestiary').disabled = !State.hasBestiary();
  }

  init();
</script>
