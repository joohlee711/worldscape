<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>귓것 — 탑의 기억</title>
<style>
  :root {
    --bg: #0a0706;
    --bg-soft: #120e0c;
    --ink: #e8d8b8;
    --ink-dim: #8a7960;
    --blood: #7a1e1a;
    --gold: #a88853;
    --accent: #c9a76a;
    --border: #3a2e22;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Serif KR", "Nanum Myeongjo", "Batang", serif;
    overflow: hidden;
  }

  body {
    background:
      radial-gradient(ellipse at 50% 20%, rgba(90,40,20,0.25), transparent 60%),
      radial-gradient(ellipse at 50% 100%, rgba(0,0,0,0.8), transparent 60%),
      var(--bg);
    position: relative;
  }

  /* 배경 노이즈 (먹 번짐 느낌) */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(0,0,0,0.04) 0 1px, transparent 1px 4px);
    pointer-events: none;
    z-index: 1;
  }

  #app {
    position: relative;
    z-index: 2;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  /* ===== 타이틀 화면 ===== */
  .title-screen {
    text-align: center;
    max-width: 760px;
    animation: fadeIn 1.8s ease-out;
  }

  .title-main {
    font-size: clamp(4rem, 12vw, 8rem);
    font-weight: 900;
    letter-spacing: 0.3em;
    color: var(--ink);
    text-shadow:
      0 0 20px rgba(170, 40, 20, 0.4),
      0 0 60px rgba(170, 40, 20, 0.15);
    margin-bottom: 0.5rem;
    position: relative;
  }

  .title-main::after {
    content: "";
    display: block;
    width: 40%;
    height: 1px;
    margin: 1.2rem auto 0.8rem;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .title-sub {
    font-size: clamp(1rem, 2vw, 1.3rem);
    color: var(--ink-dim);
    letter-spacing: 0.4em;
    margin-bottom: 3rem;
  }

  .title-epigraph {
    font-size: 0.95rem;
    color: var(--ink-dim);
    line-height: 2;
    max-width: 520px;
    margin: 0 auto 3.5rem;
    font-style: italic;
    opacity: 0.85;
    text-align: center;
  }

  .title-epigraph cite {
    display: block;
    margin-top: 1rem;
    font-size: 0.8rem;
    color: var(--gold);
    font-style: normal;
    letter-spacing: 0.2em;
  }

  .title-buttons {
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
    align-items: center;
  }

  .btn {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--border);
    padding: 0.9rem 3rem;
    font-size: 1rem;
    font-family: inherit;
    letter-spacing: 0.3em;
    cursor: pointer;
    transition: all 0.3s ease;
    min-width: 260px;
    position: relative;
  }

  .btn:hover {
    background: rgba(201, 167, 106, 0.08);
    border-color: var(--accent);
    color: var(--accent);
    letter-spacing: 0.4em;
  }

  .btn:disabled {
    color: var(--ink-dim);
    border-color: #2a2018;
    cursor: not-allowed;
  }

  .btn-primary {
    border-color: var(--accent);
    color: var(--accent);
  }

  .btn-primary:hover {
    background: rgba(201, 167, 106, 0.15);
    box-shadow: 0 0 20px rgba(201, 167, 106, 0.2);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeInSlow {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* ===== 공통 화면 컨테이너 ===== */
  .screen {
    width: 100%;
    max-width: 900px;
    animation: fadeIn 0.8s ease-out;
  }

  .screen-hidden { display: none; }

  /* ===== 캐릭터 선택 ===== */
  .select-header {
    text-align: center;
    margin-bottom: 2.5rem;
  }

  .select-header h2 {
    font-size: 2rem;
    letter-spacing: 0.3em;
    color: var(--accent);
    margin-bottom: 0.6rem;
    font-weight: 500;
  }

  .select-header p {
    color: var(--ink-dim);
    font-size: 0.95rem;
    letter-spacing: 0.1em;
  }

  .char-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1.2rem;
    margin-bottom: 2rem;
  }

  .char-card {
    background: linear-gradient(180deg, rgba(30,22,18,0.6), rgba(15,10,8,0.8));
    border: 1px solid var(--border);
    padding: 1.5rem 1.2rem;
    cursor: pointer;
    transition: all 0.3s ease;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .char-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0.3;
  }

  .char-card:hover {
    border-color: var(--accent);
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.6), 0 0 20px rgba(201,167,106,0.1);
  }

  .char-card .glyph {
    font-size: 3rem;
    color: var(--accent);
    margin-bottom: 0.8rem;
    font-weight: 900;
    letter-spacing: -0.1em;
    opacity: 0.85;
  }

  .char-card h3 {
    font-size: 1.3rem;
    color: var(--ink);
    margin-bottom: 0.4rem;
    letter-spacing: 0.15em;
  }

  .char-card .role {
    font-size: 0.8rem;
    color: var(--gold);
    letter-spacing: 0.2em;
    margin-bottom: 0.8rem;
  }

  .char-card .desc {
    font-size: 0.85rem;
    color: var(--ink-dim);
    line-height: 1.7;
  }

  .char-card.completed {
    border-color: var(--blood);
  }

  .char-card.completed::after {
    content: "흉접";
    position: absolute;
    top: 8px; right: 8px;
    font-size: 0.7rem;
    color: var(--blood);
    letter-spacing: 0.2em;
    border: 1px solid var(--blood);
    padding: 2px 6px;
  }

  .nav-bar {
    display: flex;
    justify-content: space-between;
    margin-top: 1.5rem;
  }

  .btn-ghost {
    background: transparent;
    border: none;
    color: var(--ink-dim);
    font-family: inherit;
    font-size: 0.9rem;
    letter-spacing: 0.2em;
    cursor: pointer;
    padding: 0.5rem 1rem;
    transition: color 0.3s;
  }

  .btn-ghost:hover { color: var(--accent); }

  /* ===== 씬 화면 ===== */
  .scene-wrap {
    display: flex;
    flex-direction: column;
    height: calc(100vh - 4rem);
    max-height: 800px;
  }

  .scene-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 2rem;
  }

  .scene-location {
    color: var(--gold);
    font-size: 0.9rem;
    letter-spacing: 0.3em;
  }

  .scene-character {
    color: var(--ink-dim);
    font-size: 0.85rem;
    letter-spacing: 0.2em;
  }

  .scene-body {
    flex: 1;
    overflow-y: auto;
    padding: 1rem 0.5rem 2rem 0.5rem;
    line-height: 2.1;
    font-size: 1.05rem;
    color: var(--ink);
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .scene-body::-webkit-scrollbar { width: 6px; }
  .scene-body::-webkit-scrollbar-thumb { background: var(--border); }

  .scene-body p {
    margin-bottom: 1.2rem;
    animation: fadeInSlow 0.8s ease-out;
  }

  .scene-body .dialogue {
    color: var(--accent);
    padding-left: 1.2rem;
    border-left: 2px solid var(--border);
    font-style: italic;
  }

  .scene-body .whisper {
    color: var(--ink-dim);
    font-size: 0.95rem;
    text-align: center;
    letter-spacing: 0.15em;
  }

  .scene-body .omen {
    color: var(--blood);
    text-align: center;
    font-size: 1.1rem;
    letter-spacing: 0.3em;
    margin: 2rem 0;
    text-shadow: 0 0 12px rgba(122, 30, 26, 0.6);
  }

  .cursor-blink::after {
    content: "▍";
    color: var(--accent);
    animation: blink 0.8s step-end infinite;
    margin-left: 2px;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  .scene-footer {
    border-top: 1px solid var(--border);
    padding-top: 1.2rem;
    margin-top: 1rem;
  }

  .choices {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    animation: fadeIn 0.6s ease-out;
  }

  .choice {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--ink);
    font-family: inherit;
    padding: 0.9rem 1.4rem;
    text-align: left;
    cursor: pointer;
    font-size: 0.98rem;
    transition: all 0.25s;
    line-height: 1.6;
  }

  .choice:hover {
    border-color: var(--accent);
    background: rgba(201,167,106,0.06);
    color: var(--accent);
    transform: translateX(4px);
  }

  .choice .idx {
    color: var(--gold);
    margin-right: 0.8rem;
    font-weight: 700;
  }

  .continue-btn {
    display: block;
    margin: 0 auto;
    padding: 0.6rem 2rem;
    font-size: 0.9rem;
    letter-spacing: 0.4em;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--gold);
    font-family: inherit;
    cursor: pointer;
    transition: all 0.3s;
  }

  .continue-btn:hover {
    border-color: var(--accent);
    background: rgba(201,167,106,0.08);
  }

  /* ===== 결말 화면 ===== */
  .ending-screen {
    text-align: center;
    max-width: 700px;
    padding: 3rem 2rem;
  }

  .ending-title {
    font-size: 2.5rem;
    letter-spacing: 0.3em;
    color: var(--blood);
    margin-bottom: 1rem;
    text-shadow: 0 0 20px rgba(122, 30, 26, 0.5);
  }

  .ending-title.safe { color: var(--gold); text-shadow: 0 0 20px rgba(201,167,106,0.3); }
  .ending-title.cursed { color: var(--blood); }

  .ending-label {
    font-size: 0.85rem;
    color: var(--ink-dim);
    letter-spacing: 0.4em;
    margin-bottom: 2rem;
  }

  .ending-body {
    color: var(--ink);
    line-height: 2;
    font-size: 1rem;
    margin-bottom: 2.5rem;
    text-align: left;
  }

  .ending-body p {
    margin-bottom: 1rem;
    animation: fadeInSlow 1s ease-out;
  }

  .ending-divider {
    width: 50%;
    height: 1px;
    margin: 2rem auto;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0.4;
  }
</style>
</head>
<body>
<div id="app">

  <!-- 캐릭터 선택 -->
  <div id="screen-select" class="screen screen-hidden">
    <div class="select-header">
      <h2>시 점 을   고 르 다</h2>
      <p>네 사람이 같은 바람을 맞으나, 각자 다른 흉신을 마주한다</p>
    </div>
    <div class="char-grid" id="char-grid"></div>
    <div class="nav-bar">
      <button class="btn-ghost" id="btn-back-title">← 처음으로</button>
      <span></span>
    </div>
  </div>

  <!-- 씬 재생 -->
  <div id="screen-scene" class="screen screen-hidden">
    <div class="scene-wrap">
      <div class="scene-header">
        <span class="scene-location" id="scene-location"></span>
        <span class="scene-character" id="scene-character"></span>
      </div>
      <div class="scene-body" id="scene-body"></div>
      <div class="scene-footer" id="scene-footer"></div>
    </div>
  </div>

  <!-- 엔딩 -->
  <div id="screen-ending" class="screen screen-hidden">
    <div class="ending-screen">
      <p class="ending-label" id="ending-label">결 말</p>
      <h2 class="ending-title" id="ending-title"></h2>
      <div class="ending-divider"></div>
      <div class="ending-body" id="ending-body"></div>
      <button class="btn btn-primary" id="btn-ending-back">시 점 선 택 으 로</button>
    </div>
  </div>

  <!-- 타이틀 화면 -->
  <div id="screen-title" class="title-screen">
    <h1 class="title-main">귓것</h1>
    <p class="title-sub">탑 의 기 억</p>
    <p class="title-epigraph">
      귀한 것은 하늘에 매여있고, 흉한 것은 땅에 매여있다.<br>
      사람은 하늘이 귀할지라도 그 귀함을 모르며,<br>
      땅이 흉할지라도 그 흉함을 모른다.
      <cite>— 발라하리 전설</cite>
    </p>
    <div class="title-buttons">
      <button class="btn btn-primary" id="btn-start">이 야 기 를   시 작 하 다</button>
      <button class="btn" id="btn-continue" disabled>이 어 서   하 기</button>
      <button class="btn" id="btn-bestiary" disabled>귓 것   도 감</button>
    </div>
  </div>

</div>

<script>
  // ===== 캐릭터 정보 =====
  const CHARACTERS = {
    diraq: {
      id: 'diraq',
      name: '디라크',
      role: '퇴역 군인 / 탐사대장',
      glyph: '劍',
      desc: '제국 중앙군 출신의 노병. 익히 모르는 대륙에서 잿빛 탑의 문을 연다.',
      location: '아말 대륙 · 이름 없는 탑',
      ghost: 'docheol',
    },
    ahbiya: {
      id: 'ahbiya',
      name: '아비야',
      role: '학술원 원생',
      glyph: '字',
      desc: '다하모 학술원에서 문학을 공부하는 청년. 할머니의 귀접을 따라 소도에 들다.',
      location: '미오 연합 · 미트리아 성소',
      ghost: 'hondon',
    },
    gerun: {
      id: 'gerun',
      name: '게룬',
      role: '북방의 망나니',
      glyph: '弓',
      desc: '바랏사의 사고뭉치 청년. 다리를 다친 채 설산 수렵행에 기어이 오르다.',
      location: '예히 공국 · 바랏사 설산',
      ghost: 'gungi',
    },
    hiyar: {
      id: 'hiyar',
      name: '히야르',
      role: '루한 소대장',
      glyph: '雪',
      desc: '유력 세도가의 조카. 함다 산 수색대를 이끌고 적진 깊숙이 들어가다.',
      location: '루한 공국 · 함다 산',
      ghost: 'doul',
    },
  };

  const GHOSTS = {
    docheol: { name: '도철', subtitle: '饕餮' },
    gungi:   { name: '궁기', subtitle: '窮奇' },
    doul:    { name: '도올', subtitle: '檮杌' },
    hondon:  { name: '혼돈', subtitle: '渾沌' },
  };

  // ===== 씬 저장소 (각 루트에서 채움) =====
  const SCENES = {};

  // ===== 디라크 루트 : 탑 프롤로그 =====
  SCENES.diraq = {
    start: {
      lines: [
        { text: '탑은 죽어있었다. 짙은 녹음 아래에 묻힌 잿빛 쇳덩어리는 홀로 신음할 뿐이다.' },
        { text: '다섯 명의 조사단은 담쟁이덩굴을 부수고 입구를 넘어섰다. 덩치 큰 디라크는 등에 걸머진 다섯 자 날붙이의 무게를 다시 가늠해 보았다.' },
        { type: 'dialogue', text: '귀신 나올 만한 곳이라더니……. 제사장들 말이 정확했네. 이번에는 제대로 찾은 거겠지?' },
        { text: '네하는 여전히 능글거렸고, 해수는 도둑놈을 잡죄었다. 구에몬은 전국 시대의 문양을 읽었고, 세녹은 조용히 주변을 살폈다.' },
        { text: '쓰러진 조각상들이 안쓰럽게 흩어져 있었으나, 2층으로 오르는 나선계단은 위압적이었다. 저 멀리 지하로 내려가는 통로가 보였다.' },
        { type: 'whisper', text: '「일단 지하부터 훑어볼까.」' },
      ],
      next: 'descend',
    },

    descend: {
      lines: [
        { text: '지하 통로는 횃불이 없이는 한 걸음도 옮기기 힘들었다. 양쪽 벽의 부조는 깊이 들어갈수록 짙어졌고, 음각의 짐승들은 어느새 양각의 인간으로 바뀌었다.' },
        { text: '벌거벗은 남녀의 교합. 인간을 집어삼키는 비대한 사람. 짐승과 뒤엉킨 군상. 머리 셋 달린 뱀이 상반신을 물어뜯고, 두 동강 난 다리는 벽면 바깥으로 돌출되어 있었다.' },
        { type: 'dialogue', text: '이봐요 교수님, 어째 탑 전체가 이단과 음란의 소굴인 것 같은데. 우리 극락 가기는 글렀네.' },
        { text: '구에몬은 기술적 성취를 들먹였다. 세녹은 긴 머리를 헝클어뜨리며 부르소 부족도 이 정도는 아니라 했다. 네하는 빙글거렸고, 디라크는 그저 속이 불편할 뿐이었다.' },
        { text: '복도의 끝, 별무리가 장엄하게 휘감긴 매끈한 문이 나타났다. 장식도 새김도 없이, 지나치게 깨끗했다.' },
      ],
      choices: [
        { text: '「내가 먼저 들어가 보겠네. 신호를 주기 전까진 따라오지 마라.」', next: 'room_alone' },
        { text: '「다 함께 들어가세. 무슨 일이 나면 같이 봐야 할 것 아닌가.」', next: 'room_together' },
      ],
    },

    room_alone: {
      lines: [
        { text: '디라크는 힘있게 문고리를 돌렸다. 뜻밖에도 문은 가볍게 열렸다.' },
        { text: '횃불을 들이밀었지만 방의 폭조차 가늠할 수 없었다. 벽에 붙어 조심스레 발을 옮겨 횃불을 걸어놓고, 허리춤에 손을 올렸다.' },
        { type: 'dialogue', text: '영감님, 어때요? 우리 들어가도 됩니까?' },
        { text: '네하의 목소리가 문 밖에서 들려오는 순간, 디라크는 위화감에 사로잡혔다. 꼬마 도둑의 목소리는 마치 물속에서 듣는 것 같이 먹먹하고 둔탁했다.' },
        { type: 'whisper', text: '어째 이리 더운 거지……?' },
        { text: '땀 한 방울이 길게 흘렀다. 시야는 아직도 어두웠고, 어느새 방 중앙 부근에 도달해 있었다. 모서리에는 — 복도의 부조가 아닌, 진짜 조각상이 완연한 고체의 질감으로 서 있었다.' },
      ],
      next: 'combat_intro',

  // ===== 게임 상태 =====
  const STORAGE_KEY = 'gitgeot_save_v1';

  const State = {
    data: {
      completed: {},      // { diraq: true, ahbiya: true, ... }
      bestiary: {},       // { docheol: true, hondon: true, ... }
      currentScene: null,
    },
    load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) this.data = Object.assign(this.data, JSON.parse(raw));
      } catch(e) {}
    },
    save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(this.data));
      } catch(e) {}
    },
    reset() {
      this.data = { completed: {}, bestiary: {}, currentScene: null };
      this.save();
    },
    hasSave() {
      return this.data.currentScene !== null;
    },
    hasBestiary() {
      return Object.keys(this.data.bestiary).length > 0;
    }
  };

  // ===== 화면 전환 =====
  function showScreen(id) {
    document.querySelectorAll('.screen, .title-screen').forEach(el => {
      el.classList.add('screen-hidden');
    });
    const target = document.getElementById(id);
    if (target) target.classList.remove('screen-hidden');
  }

  // ===== 캐릭터 선택 =====
  function renderCharSelect() {
    const grid = document.getElementById('char-grid');
    grid.innerHTML = '';
    Object.values(CHARACTERS).forEach(ch => {
      const completed = State.data.completed[ch.id];
      const card = document.createElement('div');
      card.className = 'char-card' + (completed ? ' completed' : '');
      card.innerHTML = `
        <div class="glyph">${ch.glyph}</div>
        <h3>${ch.name}</h3>
        <div class="role">${ch.role}</div>
        <div class="desc">${ch.desc}</div>
      `;
      card.addEventListener('click', () => startRoute(ch.id));
      grid.appendChild(card);
    });
    showScreen('screen-select');
  }

  // ===== 씬 재생 엔진 =====
  const Scene = {
    currentRoute: null,
    currentId: null,
    typingTimer: null,
    skip: false,

    start(route, sceneId) {
      this.currentRoute = route;
      this.currentId = sceneId;
      const ch = CHARACTERS[route];
      document.getElementById('scene-location').textContent = ch.location;
      document.getElementById('scene-character').textContent = ch.name;
      State.data.currentScene = { route, sceneId };
      State.save();
      showScreen('screen-scene');
      this.render();
    },

    render() {
      const scene = SCENES[this.currentRoute] && SCENES[this.currentRoute][this.currentId];
      if (!scene) {
        console.error('Scene not found:', this.currentRoute, this.currentId);
        return;
      }

      if (scene.ending) {
        this.showEnding(scene);
        return;
      }

      const body = document.getElementById('scene-body');
      const footer = document.getElementById('scene-footer');
      body.innerHTML = '';
      footer.innerHTML = '';
      body.scrollTop = 0;
      this.skip = false;

      this.typeLines(scene.lines || [], 0, body, () => {
        this.renderFooter(scene, footer);
      });
    },

    typeLines(lines, idx, container, done) {
      if (idx >= lines.length) { done(); return; }

      const line = lines[idx];
      const p = document.createElement('p');
      if (line.type) p.classList.add(line.type);
      p.classList.add('cursor-blink');
      container.appendChild(p);
      container.scrollTop = container.scrollHeight;

      const text = line.text || '';
      let i = 0;
      const step = () => {
        if (this.skip) {
          p.textContent = text;
          p.classList.remove('cursor-blink');
          this.typeLines(lines, idx + 1, container, done);
          return;
        }
        if (i <= text.length) {
          p.textContent = text.slice(0, i);
          i++;
          container.scrollTop = container.scrollHeight;
          this.typingTimer = setTimeout(step, line.type === 'omen' ? 70 : 22);
        } else {
          p.classList.remove('cursor-blink');
          this.typingTimer = setTimeout(() => {
            this.typeLines(lines, idx + 1, container, done);
          }, line.type === 'omen' ? 600 : 180);
        }
      };
      step();
    },

    skipTyping() {
      this.skip = true;
    },

    renderFooter(scene, footer) {
      if (scene.choices && scene.choices.length) {
        const wrap = document.createElement('div');
        wrap.className = 'choices';
        scene.choices.forEach((ch, i) => {
          const btn = document.createElement('button');
          btn.className = 'choice';
          btn.innerHTML = `<span class="idx">${['一','二','三','四'][i]||(i+1)}</span>${ch.text}`;
          btn.addEventListener('click', () => {
            Scene.start(this.currentRoute, ch.next);
          });
          wrap.appendChild(btn);
        });
        footer.appendChild(wrap);
      } else if (scene.next) {
        const btn = document.createElement('button');
        btn.className = 'continue-btn';
        btn.textContent = '다 음   →';
        btn.addEventListener('click', () => Scene.start(this.currentRoute, scene.next));
        footer.appendChild(btn);
      }
    },

    showEnding(scene) {
      const titleEl = document.getElementById('ending-title');
      const labelEl = document.getElementById('ending-label');
      const bodyEl = document.getElementById('ending-body');

      titleEl.className = 'ending-title';
      if (scene.kind) titleEl.classList.add(scene.kind);
      titleEl.textContent = scene.title || '결말';
      labelEl.textContent = scene.label || '결 말';

      bodyEl.innerHTML = '';
      (scene.lines || []).forEach(l => {
        const p = document.createElement('p');
        if (l.type) p.classList.add(l.type);
        p.textContent = l.text;
        bodyEl.appendChild(p);
      });

      // 루트 완료 기록, 도감 해금
      State.data.completed[this.currentRoute] = scene.kind || true;
      const ch = CHARACTERS[this.currentRoute];
      if (ch && ch.ghost) State.data.bestiary[ch.ghost] = true;
      State.data.currentScene = null;
      State.save();

      showScreen('screen-ending');
    },
  };

  function startRoute(charId) {
    if (!SCENES[charId]) {
      alert('이 시점의 이야기는 다음 단계에서 담깁니다.');
      return;
    }
    Scene.start(charId, 'start');
  }

  // ===== 초기화 =====
  function init() {
    State.load();

    // 버튼 활성화
    const btnContinue = document.getElementById('btn-continue');
    const btnBestiary = document.getElementById('btn-bestiary');
    if (State.hasSave()) btnContinue.disabled = false;
    if (State.hasBestiary()) btnBestiary.disabled = false;

    document.getElementById('btn-start').addEventListener('click', renderCharSelect);

    document.getElementById('btn-continue').addEventListener('click', () => {
      if (State.data.currentScene) {
        Scene.start(State.data.currentScene.route, State.data.currentScene.sceneId);
      }
    });

    document.getElementById('btn-bestiary').addEventListener('click', () => {
      alert('도감은 다음 단계에서 구현됩니다.');
    });

    document.getElementById('btn-back-title').addEventListener('click', () => {
      showScreen('screen-title');
      refreshTitleButtons();
    });

    document.getElementById('btn-ending-back').addEventListener('click', () => {
      renderCharSelect();
    });

    // 씬 화면에서 클릭 시 타이핑 스킵
    document.getElementById('screen-scene').addEventListener('click', (e) => {
      if (e.target.tagName === 'BUTTON') return;
      Scene.skipTyping();
    });
  }

  function refreshTitleButtons() {
    document.getElementById('btn-continue').disabled = !State.hasSave();
